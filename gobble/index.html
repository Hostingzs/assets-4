<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Gobble</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="webapp/fancade.css" />
    <link rel="icon" href="webapp/favicon.ico" />
    <link rel="stylesheet" href="https://gnhustgames.github.io/css/logo.css" />
<script data-mathtube-bridge src="/repairs/site-bridge.22d4e8267ad17cfc.js" defer></script>
</head>

  <body id="body">
    <div
      class="logo-homepage"
      id="logo"
      style="position: absolute; bottom: 40%"
    >
      <a href="https://gnhustgames.github.io/homepage/"
        ><button>
          <p>More Games on GNHUST Games</p>
          <img
            src="https://gnhustgames.github.io/assets/imageLogo/logo.jpg"
            alt=""
          /></button
      ></a>
    </div>
    <script>
      function checkScreenSize() {
        var hiddenBlock = document.querySelector("#logo");
        if (window.innerWidth > 1200) {
          hiddenBlock.style.display = "block";
        } else {
          hiddenBlock.style.display = "none";
        }
      }

      // Add an event listener to check the size whenever the window is load or réize
      window.addEventListener("load", checkScreenSize);
      window.addEventListener("resize", checkScreenSize);
      // Initial check when the page loads
      checkScreenSize();
    </script>
    <div id="modal_parent">
      <div id="modal_content">
        <span id="modal_close_button">&times;</span>
        <div id="store_link_modal_content" class="modal_inner"></div>
        <div id="share_file_modal_content" class="modal_inner"></div>
      </div>
    </div>
    <div id="canvas_border" class="emscripten_border">
      <div id="play_content" class="middle center">
        <div class="edge">
          <div class="box">
            <div class="black">
              <img src="webapp/cover.jpg" class="cover" />
              <p class="title">Gobble</p>
              <p class="author">Fancade</p>
            </div>
          </div>
        </div>
        <div id="progress_or_play">
          <progress
            id="progress"
            class="loading"
            value="0"
            max="100"
          ></progress>
        </div>
        <p class="description"></p>
      </div>
      <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
      <div id="gradient"></div>
      <div id="webview_content"></div>
    </div>
    <script
      type="text/javascript"
      src="webapp/source_min.js"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="webapp/index.js"
      crossorigin="anonymous"
    ></script>
  
</body>
</html>
